name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.CAMPUS_SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.CAMPUS_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.CAMPUS_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.CAMPUS_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Check public sources
        shell: bash
        run: ./tools/check-no-ip-literals.sh

      - name: Prepare stable signing when configured
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campus-signing.jks"
          echo "CAMPUS_SIGNING_STORE_FILE=$RUNNER_TEMP/campus-signing.jks" >> "$GITHUB_ENV"
          echo "CAMPUS_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CAMPUS_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CAMPUS_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build debug APK
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk campus-direct-debug.apk
          sha256sum campus-direct-debug.apk > campus-direct-debug.apk.sha256
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs campus-direct-debug.apk > signing-report.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campus-direct-debug
          path: |
            campus-direct-debug.apk
            campus-direct-debug.apk.sha256
            signing-report.txt
          if-no-files-found: error
          retention-days: 7
